server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf;

    # Vite-hashed assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicons / static public files: cache for a day
    location ~* \.(ico|png|webp|txt|xml|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML: always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
